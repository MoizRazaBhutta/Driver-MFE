<div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-lg max-w-xs text-white">
  <div class="flex items-center gap-3">
    <div
      class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg"
    >
      {{ driverName.charAt(0) }}
    </div>
    <div>
      <h4 class="font-bold text-sm">{{ driverName }}</h4>
      <p class="text-xs text-emerald-400 font-mono">Status: {{ status }}</p>
    </div>
  </div>
  <div class="mt-3 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-400">
    <span>Vehicle: {{ vehicleId }}</span>
    <span class="text-amber-400">★ {{ rating }}</span>
  </div>
</div>
